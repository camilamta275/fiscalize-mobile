name: Regressão

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fiscalize?schema=public
  JWT_SECRET: ci-only-secret
  NODE_ENV: test
  PORT: 3000
  ALLOWED_ORIGINS: http://localhost:3001
  # Created by AI.
  REPORTS_DIR: automation/reports

jobs:
  unit:
    name: Testes unitários
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      # Created by AI.
      - name: Preparar diretório de relatórios
        working-directory: .
        run: mkdir -p "$REPORTS_DIR"

      # Created by AI.
      - name: Executar testes unitários
        run: >-
          npm test --
          --passWithNoTests
          --json
          --outputFile="$GITHUB_WORKSPACE/$REPORTS_DIR/unit-jest.json"

      # Created by AI.
      - name: Gerar relatório JUnit dos testes unitários
        if: always()
        working-directory: .
        run: >-
          python3 automation/scripts/jest_to_junit.py
          "$REPORTS_DIR/unit-jest.json"
          "$REPORTS_DIR/unit-junit.xml"

      # Created by AI.
      - name: Resumo dos testes unitários
        if: always()
        working-directory: .
        run: >-
          python3 automation/scripts/junit_summary.py
          --title "Testes unitários"
          "$REPORTS_DIR/unit-junit.xml"

      # Created by AI.
      - name: Preparar artefatos dos testes unitários
        if: always()
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts/fiscalize-mobile/reports"
          if [ -d "$REPORTS_DIR" ]; then
            cp -R "$REPORTS_DIR"/. "$RUNNER_TEMP/artifacts/fiscalize-mobile/reports"/
          fi

      # Created by AI.
      - name: Publicar artefatos dos testes unitários
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-unit
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: warn
          retention-days: 14

  api:
    name: Testes de API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fiscalize
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d fiscalize"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências do backend
        working-directory: backend
        run: npm ci

      - name: Preparar banco de dados
        working-directory: backend
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run seed

      - name: Iniciar API
        working-directory: backend
        run: |
          npm run dev > "$RUNNER_TEMP/fiscalize-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/fiscalize-api.pid"

      - name: Aguardar API
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/fiscalize-api.log"
          exit 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Instalar dependências de automação
        run: python -m pip install -r automation/requirements.txt

      # Created by AI.
      - name: Preparar diretório de relatórios
        run: mkdir -p "$REPORTS_DIR"

      # Updated by AI.
      - name: Executar testes de API
        working-directory: automation
        run: >-
          python -m pytest tests/api/tests
          --junitxml="$GITHUB_WORKSPACE/$REPORTS_DIR/api-junit.xml"
          --html="$GITHUB_WORKSPACE/$REPORTS_DIR/api-report.html"
          --self-contained-html

      # Updated by AI.
      - name: Executar smoke test antes do merge
        if: github.event_name == 'pull_request' || github.event_name == 'schedule'
        working-directory: automation
        run: >-
          python -m pytest tests/api/tests/test_cidadao.py::test_api
          --maxfail=1
          --junitxml="$GITHUB_WORKSPACE/$REPORTS_DIR/api-smoke-junit.xml"
          --html="$GITHUB_WORKSPACE/$REPORTS_DIR/api-smoke-report.html"
          --self-contained-html

      # Created by AI.
      - name: Resumo dos testes de API
        if: always()
        run: >-
          python automation/scripts/junit_summary.py
          --title "Testes de API"
          "$REPORTS_DIR/api-junit.xml"
          "$REPORTS_DIR/api-smoke-junit.xml"

      # Created by AI.
      - name: Preparar artefatos dos testes de API
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts/fiscalize-mobile/reports"
          if [ -d "$REPORTS_DIR" ]; then
            cp -R "$REPORTS_DIR"/. "$RUNNER_TEMP/artifacts/fiscalize-mobile/reports"/
          fi
          if [ -f "$RUNNER_TEMP/fiscalize-api.log" ]; then
            cp "$RUNNER_TEMP/fiscalize-api.log" "$RUNNER_TEMP/artifacts/fiscalize-mobile/reports"/
          fi

      # Created by AI.
      - name: Publicar artefatos dos testes de API
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-api
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: warn
          retention-days: 14

  regression:
    name: Suíte completa de regressão
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fiscalize
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d fiscalize"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Created by AI.
      - name: Preparar diretório de relatórios
        run: mkdir -p "$REPORTS_DIR"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências do backend
        working-directory: backend
        run: npm ci

      # Updated by AI.
      - name: Executar testes unitários
        working-directory: backend
        run: >-
          npm test --
          --passWithNoTests
          --json
          --outputFile="$GITHUB_WORKSPACE/$REPORTS_DIR/regression-unit-jest.json"

      - name: Preparar banco e iniciar API
        working-directory: backend
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run seed
          npm run dev > "$RUNNER_TEMP/fiscalize-api.log" 2>&1 &

      - name: Aguardar API
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/fiscalize-api.log"
          exit 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Instalar dependências de automação
        run: python -m pip install -r automation/requirements.txt

      # Created by AI.
      - name: Gerar relatório JUnit dos testes unitários
        if: always()
        run: >-
          python automation/scripts/jest_to_junit.py
          "$REPORTS_DIR/regression-unit-jest.json"
          "$REPORTS_DIR/regression-unit-junit.xml"

      # Updated by AI.
      - name: Executar todos os testes automatizados
        working-directory: automation
        run: >-
          python -m pytest tests
          --junitxml="$GITHUB_WORKSPACE/$REPORTS_DIR/regression-junit.xml"
          --html="$GITHUB_WORKSPACE/$REPORTS_DIR/regression-report.html"
          --self-contained-html

      # Created by AI.
      - name: Resumo da suíte de regressão
        if: always()
        run: >-
          python automation/scripts/junit_summary.py
          --title "Suíte completa de regressão"
          "$REPORTS_DIR/regression-unit-junit.xml"
          "$REPORTS_DIR/regression-junit.xml"

      # Created by AI.
      - name: Preparar artefatos da regressão
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts/fiscalize-mobile/reports"
          if [ -d "$REPORTS_DIR" ]; then
            cp -R "$REPORTS_DIR"/. "$RUNNER_TEMP/artifacts/fiscalize-mobile/reports"/
          fi
          if [ -f "$RUNNER_TEMP/fiscalize-api.log" ]; then
            cp "$RUNNER_TEMP/fiscalize-api.log" "$RUNNER_TEMP/artifacts/fiscalize-mobile/reports"/
          fi

      # Created by AI.
      - name: Publicar artefatos da regressão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-regression
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: warn
          retention-days: 14

  # Created by AI.
  notify-failure:
    name: Abrir issue de falha
    needs: [unit, api, regression]
    if: >-
      always() &&
      contains(needs.*.result, 'failure') &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # Created by AI.
      - name: Criar ou atualizar issue
        uses: actions/github-script@v7
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          API_RESULT: ${{ needs.api.result }}
          REGRESSION_RESULT: ${{ needs.regression.result }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const branch =
              context.payload.pull_request?.head?.ref ??
              context.ref.replace(/^refs\/heads\//, '') ??
              context.payload.repository.default_branch;
            const title = `[CI] Falha em "${context.workflow}" — ${branch}`;

            const jobs = [
              ['Testes unitários', process.env.UNIT_RESULT],
              ['Testes de API', process.env.API_RESULT],
              ['Suíte completa de regressão', process.env.REGRESSION_RESULT],
            ];

            const icons = {
              success: '✅ success',
              failure: '❌ failure',
              cancelled: '🚫 cancelled',
              skipped: '⚪ skipped',
            };
            const failed = jobs
              .filter(([, result]) => result === 'failure')
              .map(([name]) => name);

            const table = jobs
              .map(([name, result]) => `| ${name} | ${icons[result] ?? result} |`)
              .join('\n');

            const body = [
              `O workflow **${context.workflow}** falhou na branch \`${branch}\`.`,
              '',
              `- **Evento:** \`${context.eventName}\``,
              `- **Commit:** \`${context.sha.slice(0, 7)}\``,
              `- **Execução:** ${runUrl}`,
              `- **Artefatos (JUnit XML + HTML):** ${runUrl}#artifacts`,
              '',
              '| Job | Resultado |',
              '| --- | --- |',
              table,
              '',
              failed.length
                ? `**Jobs com falha:** ${failed.join(', ')}`
                : '**Nenhum job com falha direta** (verifique cancelamentos).',
              '',
              'Os relatórios JUnit XML e HTML desta execução estão anexados como artefatos.',
            ].join('\n');

            const label = 'falha-ci';
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: label,
                color: 'd73a4a',
                description: 'Falha em execução de CI',
              });
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'all',
              labels: label,
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Nova falha detectada.\n\n${body}`,
              });
              if (existing.state === 'closed') {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  state: 'open',
                });
              }
              core.info(`Issue #${existing.number} atualizada: ${title}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: [label],
              });
              core.info(`Issue #${created.number} criada: ${title}`);
            }
