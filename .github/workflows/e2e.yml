name: E2E mobile

# Created by AI.
# Executa a suíte E2E (Maestro) com o app integrado ao backend REAL:
#   PostgreSQL (com seed) + API Node + app Android instalado num emulador.
# O fluxo principal é registrar a denúncia, acompanhar a mudança de status e
# verificar a notificação (automation/tests/e2e/test_fluxo_registrar_acompanhar_notificar.py),
# além dos cenários negativos (senha incorreta e bloqueio de ação exclusiva do Gestor).
#
# Roda sob demanda, todo dia e em pushes na main. Não é executado em todo pull
# request porque o build do app + emulador levam alguns minutos.
# Updated by AI.
# Push só de documentação não dispara o E2E; o agendamento diário continua rodando.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "USO_IA/**"
  schedule:
    # 06:53 UTC = 03:53 em Recife (fora da hora cheia, que concentra a fila do GitHub Actions).
    - cron: "53 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fiscalize?schema=public
  JWT_SECRET: ci-only-secret
  NODE_ENV: test
  PORT: 3000
  ALLOWED_ORIGINS: http://localhost:3001
  REPORTS_DIR: automation/reports
  APP_ID: br.com.fiscalize.mobile

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (app + backend real)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fiscalize
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d fiscalize"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # --- Backend real -------------------------------------------------
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Instalar dependências do backend
        working-directory: backend
        run: npm ci

      - name: Preparar banco de dados
        working-directory: backend
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run seed

      - name: Iniciar API
        working-directory: backend
        run: |
          npm run dev > "$RUNNER_TEMP/fiscalize-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/fiscalize-api.pid"

      - name: Aguardar API
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/fiscalize-api.log"
          exit 1

      # --- App Android ----------------------------------------------------
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar dependências do app
        working-directory: mobile
        run: npm ci

      # O emulador enxerga o backend do runner em 10.0.2.2:3000 (padrão do app no Android).
      # O build release embute o JS (não depende do Metro) e é assinado com a chave de debug.
      # O tráfego HTTP em texto claro é liberado SOMENTE neste build de CI.
      - name: Gerar o app Android
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_BASE_URL: http://10.0.2.2:3000
        run: |
          npx expo prebuild --platform android --no-install
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /' android/app/src/main/AndroidManifest.xml
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon

      # --- Automação ------------------------------------------------------
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Instalar dependências de automação
        run: python -m pip install -r automation/requirements.txt

      - name: Instalar o Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Preparar diretório de relatórios
        run: mkdir -p "$REPORTS_DIR"

      # E2E_OBRIGATORIO=1: sem emulador/Maestro o teste FALHA em vez de ser ignorado,
      # evitando um resultado verde sem execução real.
      - name: Executar a suíte E2E no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r mobile/android/app/build/outputs/apk/release/app-release.apk
            adb shell pm grant ${{ env.APP_ID }} android.permission.POST_NOTIFICATIONS
            adb shell pm grant ${{ env.APP_ID }} android.permission.ACCESS_FINE_LOCATION
            adb shell pm grant ${{ env.APP_ID }} android.permission.ACCESS_COARSE_LOCATION
            adb shell pm grant ${{ env.APP_ID }} android.permission.CAMERA
            cd automation && E2E_OBRIGATORIO=1 python -m pytest tests/e2e -o addopts="" -v --junitxml="$GITHUB_WORKSPACE/${{ env.REPORTS_DIR }}/e2e-junit.xml"

      - name: Resumo da suíte E2E
        if: always()
        run: |
          if [ -f "$REPORTS_DIR/e2e-junit.xml" ]; then
            python automation/scripts/junit_summary.py --title "Testes E2E (app + backend real)" "$REPORTS_DIR/e2e-junit.xml" >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Publicar artefatos do E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-e2e
          path: |
            automation/reports/e2e-junit.xml
            ~/.maestro/tests
          if-no-files-found: warn
          retention-days: 14
