[pytest]
testpaths = tests
# Coloca a raiz do repositório no sys.path para os imports "automation.tests.api.*"
pythonpath = ..
# Updated by AI.
# Relatórios únicos, sempre em automation/reports/ (o pytest cria o diretório)
addopts = -v --html=reports/api-report.html --junitxml=reports/api-junit.xml --self-contained-html

# Updated by AI.
# Guarda stdout, stderr e logs capturados no JUnit XML, mas só dos testes que falham.
junit_logging = all
junit_log_passing_tests = false

# Logging configuration
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s - %(levelname)s - %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

# The API test backend must run with NODE_ENV=test or TRUST_PROXY=1 so the
# synthetic X-Forwarded-For values used for test isolation are trusted.