# Validação de senha do formulário de login.
# Não representa TC02/TS02. Este fluxo testa a regra de política de senha e não
# a autenticação de um usuário existente com credenciais inválidas.
appId: br.com.fiscalize.mobile

---
- launchApp

- tapOn:
    id: "login-email"
- inputText: "teste@exemplo.com"

- tapOn:
    id: "login-password"
- inputText: "123"

- hideKeyboard

- tapOn:
    id: "login-submit"

- assertVisible: "Senha deve ter no mínimo 8 caracteres, incluindo letras maiúsculas e minúsculas, número e caractere especial"
- assertNotVisible: "Email inválido"