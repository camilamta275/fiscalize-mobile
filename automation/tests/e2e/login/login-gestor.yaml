# Cobertura complementar mobile do gestor.
# Não equivale ao caso WEB completo de TC06/TS09 e não deve ser tratado como
# prova integral de acesso administrativo do gestor.
# Updated by AI.
# Provide test-manager credentials through the process environment; never commit them.
# CI verifies OTP through the normal API flow before launching this app.
# For local runs, sign in with OTP once and keep the device's trusted state.
# The account must have at least one seeded occurrence visible in its list.
appId: br.com.fiscalize.mobile

---
- launchApp
- assertVisible:
    id: "login-email"

- tapOn:
    id: "login-email"
- inputText: ${MAESTRO_TC06_EMAIL}

- tapOn:
    id: "login-password"
- inputText: ${MAESTRO_TC06_PASSWORD}
- hideKeyboard

- tapOn:
    id: "login-submit"

- assertVisible: "Ocorrências"
- assertNotVisible: "Registrar nova ocorrência"
- assertVisible:
    text: "Abrir ocorrência .*"
- tapOn:
    text: "Abrir ocorrência .*"

# O botão é o último item da tela de detalhe (ScrollView); fica abaixo da dobra.
- scrollUntilVisible:
    element: "Atualizar status"
- assertNotVisible: "Editar ocorrência"
