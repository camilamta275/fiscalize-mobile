appId: br.com.fiscalize.mobile

# Created by AI.
# Updated by AI.
---
- launchApp:
    clearState: true

- tapOn: "Não tem conta? Criar conta"

- assertVisible: "Criar conta"
- assertVisible: "Dados pessoais"
- assertVisible: "Nome completo"
# O link fica abaixo da dobra em telas menores; rola até ele em vez de assumir que já está visível.
- scrollUntilVisible:
    element:
      id: "register-login-link"
    direction: DOWN
- assertVisible: "Já tem conta? Entrar"

- scrollUntilVisible:
    element:
      id: "register-privacy-checkbox-box"
    direction: DOWN
- tapOn: "Política de Privacidade"

- assertVisible: "Política de Privacidade"
- assertVisible: "Leia o documento antes de decidir sobre o consentimento."
# O botão "Fechar" fica no fim do texto da política (ScrollView longo).
- scrollUntilVisible:
    element: "Fechar"
    timeout: 30000
- tapOn: "Fechar"

- assertVisible: "Criar conta"
- assertNotVisible: "Leia o documento antes de decidir sobre o consentimento."
